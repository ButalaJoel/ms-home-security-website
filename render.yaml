# Render settings for the MS Security Systems website (a free static site).
# Render reads this file when the site is created as a Blueprint and on every push.
# The website talks to the POS directly at pos.mssecuritysystemsltd.com, so the
# POS server must list https://mssecuritysystemsltd.com in WEBSITE_URL.
services:
  - type: web
    runtime: static
    name: ms-security-systems-website
    repo: https://github.com/ButalaJoel/ms-home-security-website
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - mssecuritysystemsltd.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_POS_API_URL
        value: https://pos.mssecuritysystemsltd.com
      - key: SITE_URL
        value: https://mssecuritysystemsltd.com
      - key: POS_URL
        value: https://pos.mssecuritysystemsltd.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://pos.mssecuritysystemsltd.com; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      # Every page address loads the app; real files (assets, photos, sitemap) are served as they are.
      - type: rewrite
        source: /*
        destination: /index.html
